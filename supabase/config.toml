# Local OCR stays client-side. This free proxy keeps the optional Pokémon TCG
# API key off the device while allowing unauthenticated scanner lookups.
[functions.pokemon-card-search]
verify_jwt = false

# Gemini credentials stay in Edge Function secrets; the browser receives only
# normalized identification fields and never the API key.
[functions.pokemon-card-identify]
verify_jwt = false
